# Gold set — 20 apps, stratified (seed=20260817), for accuracy measurement.
#
# Labels were established by independent assessment against primary vendor documentation,
# separate from the extraction pipeline (a different model and method than the Gemini
# extractor + OpenRouter critic that produce the dataset). See NOTES.md for method and the
# honest limitation. `composio_toolkit` mirrors the deterministic catalog diff, not a model
# judgment. Genuinely ambiguous entities are labelled `UNKNOWN`/`unknown` on purpose — that
# is the correct answer, and it tests whether the pipeline abstains.
#
# Fields scored: auth_schemes (primary), gate, mcp, composio_toolkit, buildability.

- slug: mermaid-cli
  stratum: not_an_app
